# JVM: comfortable heap for KSP + R8 on a 7 GB GitHub runner without exhausting it.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Do not use the configuration cache: KSP/Room invalidation plus this plugin set is
# not yet reliably cacheable and a stale cache would be a silent failure mode.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

kotlin.code.style=official
